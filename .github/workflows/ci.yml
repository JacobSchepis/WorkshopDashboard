name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WorkshopDashboard.sln

      - name: Build
        run: dotnet build WorkshopDashboard.sln --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test WorkshopDashboard.sln --no-build -c Release --logger "console;verbosity=normal"
